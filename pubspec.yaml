name: nomadly
description: "Your personal travel assistant for smarter currency conversions and tax refunds."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.3.2
  dio_cache_interceptor: ^3.5.0
  image_picker: ^1.0.4
  http_parser: ^4.0.2
  
  fl_chart: ^0.64.0
  speech_to_text: ^7.0.0
  http: ^1.3.0
  
  flutter_tts: ^4.0.0
  intl: ^0.18.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.5
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  google_sign_in: ^6.1.6
  googleapis: ^12.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  cached_network_image: ^3.3.0
  uuid: ^4.3.3
  flutter_native_splash: ^2.3.2
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  
  provider: ^6.0.5
  shared_preferences: ^2.2.2  # Updated version
  flutter_chat_ui: ^1.6.9
  flutter_markdown: ^0.6.18
  font_awesome_flutter: ^10.6.0
  add_2_calendar: ^2.0.2 

  # Add this line
  

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  # Add this line for skeleton loading effects

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 # Add this line

flutter_native_splash:
  color: "#000000"
  image: assets/logodark.png
  color_dark: "#000000"
  image_dark: assets/logodark.png
  android_12:
    image: assets/logodark.png
    icon_background_color: "#000000"
    image_dark: assets/logodark.png
    icon_background_color_dark: "#000000"
  web: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/applogo.png" # Ensure this points to applogo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/applogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/travel_illustration.png
    - assets/logodark.png
    - assets/images/travel_illustration.png
    - assets/images/flight.jpg
    - assets/images/hotel.jpg
    - assets/images/concert.jpg
    - assets/tips.json
    - tips.json
    - assets/images/
    - assets/country_images.json